<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tổng kê đường dây – Tổ thiết kế</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#f5f4f0;--panel:#fff;--ink:#1d2321;--mute:#6b716e;--line:#dcdad3;--line2:#ecebe6;
  --acc:#0f5c4a;--acc2:#e3efe9;--inp:#fffbea;--auto:#f1f1ee;--warn:#b4470f;--warnbg:#fdf0e6;--sec:#e9eef6;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#151817;--panel:#1d2120;--ink:#e6e8e6;--mute:#9aa19d;--line:#343a38;--line2:#2a2f2d;
  --acc:#5fc2a3;--acc2:#1f3530;--inp:#26241a;--auto:#232726;--warn:#f0995c;--warnbg:#3a2518;--sec:#1f2633;}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:13px;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 11px}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
@media (prefers-color-scheme:dark){button.pri{color:#0d1513}}
button.ghost{border-color:transparent;background:transparent;padding:3px 6px;color:var(--mute)}
button.ghost:hover{color:var(--ink);border-color:var(--line)}
button.danger{color:var(--warn)}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{font:inherit;color:var(--ink)}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0;font-weight:700;letter-spacing:-.01em}
header .sub{color:var(--mute);font-size:12px}
header .sp{flex:1}
#status{font-size:12px;color:var(--mute)}
#userbar a{color:var(--acc)}
#status.err{color:var(--warn)}
main{flex:1;display:flex;min-height:0}
aside{width:250px;flex:none;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
aside .top{padding:10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line2)}
aside input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
#plist{overflow:auto;flex:1;padding:6px}
.pi{padding:8px 9px;border-radius:6px;cursor:pointer;margin-bottom:2px}
.pi:hover{background:var(--line2)}
.pi.on{background:var(--acc2)}
.pi b{display:block;font-weight:600;line-height:1.3}
.pi small{color:var(--mute);font-size:11px}
.empty{color:var(--mute);padding:30px 18px;text-align:center;line-height:1.6}
#work{flex:1;display:flex;flex-direction:column;min-width:0}
.ph{padding:12px 16px 0;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph h2{margin:0;font-size:17px;font-weight:700}
.ph .meta{color:var(--mute);font-size:12px;margin-top:3px}
.ph .act{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;padding:10px 16px 0;border-bottom:1px solid var(--line)}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:8px 12px;color:var(--mute);font-weight:500}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
.pane{flex:1;overflow:auto;min-height:0;padding:12px 16px 40px}
.kpis{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:120px}
.kpi span{display:block;color:var(--mute);font-size:11px}
.kpi b{font-size:17px;font-family:var(--mono);font-weight:500}
.hint{color:var(--mute);font-size:12px;margin:0 0 10px;line-height:1.55}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:6px;padding:8px 10px;margin-bottom:10px;font-size:12px}
table{border-collapse:separate;border-spacing:0;background:var(--panel)}
.grid th,.grid td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0;white-space:nowrap}
.grid th{position:sticky;top:0;z-index:2;background:var(--panel);font-weight:600;font-size:11px;padding:6px 5px;text-align:center;white-space:normal;line-height:1.25;border-bottom:1px solid var(--line);vertical-align:bottom}
.grid th.g{color:var(--mute);font-weight:500}
.grid td input,.grid td select{border:none;background:var(--inp);padding:5px 5px;height:28px;width:100%;outline:none;border-radius:0}
.grid td select{padding:0 2px;cursor:pointer}
.grid td input:focus,.grid td select:focus{box-shadow:inset 0 0 0 2px var(--acc)}
.grid td input.n{text-align:right;font-family:var(--mono);font-size:12px}
.grid td.auto{background:var(--auto);text-align:right;font-family:var(--mono);font-size:12px;padding:0 6px;color:var(--mute)}
.grid td.ctl{background:var(--panel);padding:0 2px}
.grid td.grp input,.grid td.grp select{background:transparent}
.grid tfoot td{position:sticky;bottom:0;z-index:2;background:var(--panel);border-top:2px solid var(--ink);font-weight:700;text-align:right;font-family:var(--mono);font-size:12px;padding:6px 6px;white-space:nowrap}
.grid tfoot td.c0{z-index:3;text-align:center;font-family:inherit}
.grid tfoot td.c1{z-index:3;text-align:left;font-family:inherit}
.grid th.gh1{height:26px;padding:4px 5px;font-size:11px;white-space:nowrap}
.grid thead tr:nth-child(2) th{top:27px}
.grid td.bad select,.grid td.bad input{background:var(--warnbg);color:var(--warn)}
.grid tr.sec td input{background:var(--sec);font-weight:600}
.grid td.c0{position:sticky;left:0;z-index:1}
.grid th.c0{left:0;z-index:3}
.grid td.c1{position:sticky;left:56px;z-index:1}
.grid th.c1{left:56px;z-index:3}
.grid td.c0{padding:0 2px;color:var(--mute)}
.c0 .tt{display:flex;align-items:center;justify-content:space-between;gap:2px;height:28px}
.c0 .tt span{flex:1;text-align:center}
.c0 .tt button{border:none;background:transparent;color:var(--mute);padding:0 3px;font-size:13px;line-height:1;border-radius:4px;opacity:.25}
tr:hover .c0 .tt button{opacity:1}
.c0 .tt button:hover{background:var(--acc2);color:var(--acc)}
.insgap{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--acc);pointer-events:none}
.gocbox{display:flex;align-items:center;gap:1px;background:var(--inp);height:28px;padding-left:4px}
.gocbox .gl{font-size:11px;color:var(--mute);min-width:24px;font-family:var(--mono)}
.gocbox input{width:38px!important;padding:3px 3px!important;height:24px!important;text-align:right}
.gocbox input[data-k=gocD]{width:44px!important}
.gocbox b{font-weight:400;color:var(--mute);font-size:12px;margin:0 1px}
.gocbox select{width:62px!important;height:24px!important;margin-left:4px}
td.gocc.badg .gocbox{background:var(--warnbg)}
.credit{border-top:1px solid var(--line2);padding:10px 12px;font-size:11px;color:var(--mute);line-height:1.5}
.credit b{color:var(--acc)}
#splash{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#1c6b57,#0b3a2f 70%);color:#fff;transition:opacity .5s;cursor:pointer}
#splash.hide{opacity:0;pointer-events:none}
#splash .card{text-align:center;max-width:560px;padding:30px}
#splash .logo{width:76px;height:76px;margin:0 auto 18px}
#splash h1{font-size:26px;margin:0 0 6px;letter-spacing:-.01em}
#splash .sub{opacity:.8;font-size:14px;margin-bottom:26px}
#splash .au{font-size:13px;opacity:.75;text-transform:uppercase;letter-spacing:.12em}
#splash .name{font-size:22px;font-weight:700;margin-top:4px}
#splash .hint2{margin-top:30px;font-size:12px;opacity:.55}
.badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.04em;background:#fde68a;color:#7c4a03;border-radius:4px;padding:1px 4px;vertical-align:1px}
.cmenu{position:fixed;z-index:70;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:4px;min-width:230px}
.cmenu button{display:flex;justify-content:space-between;gap:16px;width:100%;text-align:left;border:none;background:transparent;padding:7px 10px;border-radius:5px}
.cmenu button:hover{background:var(--acc2)}
.cmenu button small{color:var(--mute)}
.cmenu hr{border:none;border-top:1px solid var(--line2);margin:4px 0}
.cmenu .danger{color:var(--warn)}
tr.flash td{animation:fl 1.2s ease-out}
@keyframes fl{from{box-shadow:inset 0 0 0 999px rgba(15,92,74,.18)}to{box-shadow:none}}
.rowbtns{display:flex;gap:0;opacity:.35}
tr:hover .rowbtns{opacity:1}
.rowbtns button{padding:2px 4px;font-size:11px;border:none;background:transparent;color:var(--mute)}
.rowbtns button:hover{color:var(--ink)}
.tbar{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.lk th,.lk td{border-bottom:1px solid var(--line2);padding:6px 10px;text-align:left}
.lk th{background:var(--panel);position:sticky;top:0;font-size:12px;border-bottom:1px solid var(--line)}
.lk td.num{text-align:right;font-family:var(--mono)}
.lk tr.gh td{background:var(--line2);font-weight:600;font-size:12px}
.lk tr.zero td{color:var(--mute)}
.cat td{border-bottom:1px solid var(--line2);padding:0}
.cat td input,.cat td select{border:none;background:var(--inp);padding:6px;width:100%;height:30px}
.cat th{text-align:left;padding:6px;font-size:12px;border-bottom:1px solid var(--line)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:var(--panel);border-radius:10px;padding:18px;width:min(560px,94vw);max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal h3{margin:0 0 12px;font-size:15px}
.modal label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
.modal input,.modal textarea,.modal select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.modal textarea{font-family:var(--mono);font-size:11px;min-height:180px}
.modal .row{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.mono{font-family:var(--mono);font-size:11px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:12px;z-index:60}
@media (max-width:760px){aside{width:190px}}
</style>
</head>
<body>
<div id="splash" title="Bấm để bắt đầu">
  <div class="card">
    <svg class="logo" viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M32 4 L22 60 M32 4 L42 60 M25 42 H39 M27 30 H37 M29 18 H35 M14 14 H50 M18 24 H46 M14 14 V20 M50 14 V20 M18 24 V29 M46 24 V29"/></svg>
    <h1>Tổng kê phần đường dây</h1>
    <div class="sub">Bảng kê theo vị trí cột · cáp quang · liệt kê vật liệu tự động</div>
    <div class="hint2">Bấm vào màn hình để bắt đầu</div>
  </div>
</div>
<header>
  <h1>Tổng kê phần đường dây</h1>
  <span class="sub" id="userbar"></span>
  <span class="sp"></span>
  <a href="#" id="aboutLink" style="font-size:12px;color:var(--mute);text-decoration:none;margin-right:12px" title="Giới thiệu phần mềm">ⓘ Tác giả: Trịnh Minh Đức</a>
  <span id="status">Đang kết nối…</span>
</header>
<main>
  <aside>
    <div class="top">
      <button class="pri" id="btnNew">+ Tạo dự án</button>
      <button id="btnImp">⇪ Nhập từ file Excel…</button>
      <button id="btnDash">📊 Theo dõi dự án</button>
      <input id="q" placeholder="Tìm dự án…">
    </div>
    <div id="plist"></div>
    <div class="credit">Phần mềm Tổng kê đường dây<br>© Tác giả <b>Trịnh Minh Đức</b></div>
  </aside>
  <section id="work"><div class="empty" style="margin-top:60px">Chọn một dự án bên trái hoặc bấm <b>+ Tạo dự án</b>.</div></section>
</main>

<script>
/* ---------------- Cấu hình cột ---------------- */
const GROUPS = [
  ['Cot','Cột'],['Day','Dây dẫn / dây chống sét'],['Chuoi','Chuỗi cách điện'],
  ['KDV','Khung định vị'],['CRD','Chống rung dây dẫn'],['CRC','Chống rung dây chống sét / OPGW'],['Mong','Móng'],['BL','Bu lông neo'],['TD','Tiếp địa'],['BSO','Biển số thứ tự cột'],['BBNH','Biển báo nguy hiểm'],
  ['CQ','Cáp quang'],['HN','Hộp nối cáp quang'],['PKCQ','Phụ kiện cáp quang']
];
// ---- Bảng kê cáp quang (dùng chung danh sách vị trí với bảng kê đường dây) ----
const CQ_COLS = [
  ['q_nd','Số dây',46,'n',null,'Cáp quang'],['cq','Loại cáp',110,'c','CQ','Cáp quang'],
  ['q_dp','Dự phòng lên xuống cột (m)',74,'n',null,'Cáp quang'],
  ['q_them','Cáp thêm (m)',60,'n',null,'Cáp quang'],
  ['q_qhn','SL',44,'n',null,'Hộp nối'],['q_hn','Loại',150,'c','HN','Hộp nối'],
  ['q_kn','Khoá néo',56,'n',null,'Phụ kiện cáp quang'],['q_kd','Khoá đỡ',56,'n',null,'Phụ kiện cáp quang'],['q_kl','Khoá lèo',56,'n',null,'Phụ kiện cáp quang'],['q_kc','Kẹp cáp',56,'n',null,'Phụ kiện cáp quang'],['q_cr','Chống rung',62,'n',null,'Phụ kiện cáp quang'],
  ['th_cq','Cáp (m)',58,'n',null,'Phần thu hồi'],['th_kn','Khoá néo',58,'n',null,'Phần thu hồi'],['th_kd','Khoá đỡ',58,'n',null,'Phần thu hồi'],['th_kl','Khoá lèo',58,'n',null,'Phần thu hồi'],['th_kc','Kẹp cáp',58,'n',null,'Phần thu hồi'],['th_cr','Chống rung',62,'n',null,'Phần thu hồi'],
  ['q_gc','Ghi chú cáp quang',200,'t'],
];
// mã cố định của phụ kiện cáp quang (tên lấy từ danh mục nếu có)
const CQ_FIXED = [['q_kn','KNCQ','Khoá néo cáp quang','Cái'],['q_kd','KDCQ','Khoá đỡ cáp quang','Cái'],['q_kl','KLCQ','Khoá lèo cáp quang trên cột','Cái'],['q_kc','KCCQ','Kẹp cáp quang trên cột','Cái'],['q_cr','CRCQ','Chống rung cáp quang','Cái']];
const CQ_TH = [['th_cq','Cáp quang thu hồi','m'],['th_kn','Khoá néo cáp quang thu hồi','Cái'],['th_kd','Khoá đỡ cáp quang thu hồi','Cái'],['th_kl','Khoá lèo cáp quang thu hồi','Cái'],['th_kc','Kẹp cáp quang thu hồi','Cái'],['th_cr','Chống rung cáp quang thu hồi','Cái']];
const GNAME = Object.fromEntries(GROUPS);
const CD_OPTS = ['Xà PT','Néo cuối','Néo góc','Néo thẳng','Đỡ thẳng','Đỡ vượt'];
// key, header, width, kind: t=text, n=number, c=code(group), cd=công dụng
let COLS = [
  ['vt','Tên vị trí',74,'t'],
  ['cot','Loại cột',110,'c','Cot'],
  ['cd','Công dụng',96,'cd'],
  ['goc','Góc lái (độ ° phút \' giây " – trái/phải)',236,'goc'],
  ['kc','Khoảng cột (m)',70,'n'],
  ['nday','Số sợi',46,'n',null,'Dây dẫn'],['day','Loại',104,'c','Day','Dây dẫn'],
  ['ncs','Số sợi',46,'n',null,'Dây chống sét'],['cs','Loại',100,'c','Day','Dây chống sét'],
  ['qn1','SL',44,'n',null,'Chuỗi néo 1'],['n1','Loại',92,'c','Chuoi','Chuỗi néo 1'],
  ['qn2','SL',44,'n',null,'Chuỗi néo 2'],['n2','Loại',92,'c','Chuoi','Chuỗi néo 2'],
  ['qd1','SL',44,'n',null,'Chuỗi đỡ'],['d1','Loại',92,'c','Chuoi','Chuỗi đỡ'],
  ['kdv','SL',44,'n',null,'Khung định vị'],['kdvT','Loại',92,'c','KDV','Khung định vị'],
  ['cr','SL',44,'n',null,'Chống rung DD'],['crT','Loại',92,'c','CRD','Chống rung DD'],
  ['crcs','SL',44,'n',null,'Chống rung CS'],['crcsT','Loại',92,'c','CRC','Chống rung CS'],
  ['qmong','SL',44,'n',null,'Móng'],['mong','Loại',92,'c','Mong','Móng'],
  ['qbl','SL',44,'n',null,'Bu lông neo'],['bl','Loại',92,'c','BL','Bu lông neo'],
  ['qtd','SL',44,'n',null,'Tiếp địa'],['td','Loại',92,'c','TD','Tiếp địa'],
  ['qbso','SL',44,'n',null,'Biển số thứ tự cột'],['bso','Loại',110,'c','BSO','Biển số thứ tự cột'],
  ['qbbnh','SL',44,'n',null,'Biển báo nguy hiểm'],['bbnh','Loại',110,'c','BBNH','Biển báo nguy hiểm'],
  ['gc','Ghi chú',220,'t'],
];
let PAIRS = [['n1','qn1'],['n2','qn2'],['d1','qd1'],['kdvT','kdv'],['crT','cr'],['crcsT','crcs'],['mong','qmong'],['bl','qbl'],['td','qtd'],['bso','qbso'],['bbnh','qbbnh']];
const BASE_COLS=COLS.slice(), BASE_PAIRS=PAIRS.slice();
// ---- Cột thiết bị thêm riêng cho từng dự án (cur.extraCols = [{id,ten,nhom}]) ----
function extraCols(){return (typeof cur!=='undefined'&&cur&&cur.extraCols)||[]}
function rebuildCols(){const ex=extraCols();
  const add=ex.flatMap(e=>[['x_'+e.id+'_q','SL',44,'n',null,e.ten],['x_'+e.id+'_t','Loại',100,'c',e.nhom,e.ten]]);
  COLS=[...BASE_COLS.slice(0,-1),...add,BASE_COLS[BASE_COLS.length-1]];
  PAIRS=[...BASE_PAIRS,...ex.map(e=>['x_'+e.id+'_t','x_'+e.id+'_q'])]}
function allGroups(){const seen=new Set(GROUPS.map(g=>g[0]));const out=GROUPS.slice();extraCols().forEach(e=>{if(!seen.has(e.nhom)){seen.add(e.nhom);out.push([e.nhom,e.ten])}});
  projCat().forEach(c=>{if(c.nhom&&!seen.has(c.nhom)){seen.add(c.nhom);out.push([c.nhom,c.nhom.replace(/^X:/,'Nhóm khác')])}});return out}
function gname(g){const f=allGroups().find(x=>x[0]===g);return f?f[1]:(g||'')}
// dữ liệu cũ: có số lượng KĐV / chống rung nhưng chưa chọn loại → tính vào mã mặc định
const LEGACY = [['kdvT','kdv','KĐV','KDV'],['crT','cr','CR','CRD'],['crcsT','crcs','CRcs','CRC']];
const PK_MAP = {'KĐV':'KDV','CR':'CRD','CRcs':'CRC'};
function normCat(list){return (list||[]).map(c=>c.nhom==='PK'?{...c,nhom:PK_MAP[c.ma]||(/cs|csét|chống sét/i.test(c.ma+c.ten)?'CRC':/rung/i.test(c.ten)?'CRD':'KDV')}:c)}
function normRows(rs){return rs.map(r=>{if(r.type==='sec')return r;const o={...r};if(o.goc&&o.gocD===undefined){const g=parseGoc(o.goc);if(g){o.gocD=g.D;o.gocM=g.M;o.gocS=g.S;o.gocH=g.H;if(g.ten)o.gocTen=g.ten}}LEGACY.forEach(([t,q,ma])=>{if(!o[t]&&num(o[q]))o[t]=ma});return o})}
const isNeo = cd => /^(Néo|Xà)/.test(cd||'');

function colGroups(cols){const info={};let gi=-1,last=null;cols.forEach((c,j)=>{const g=c[5]||null;if(g&&g!==last)gi++;last=g;
  if(g){const prevSame=j>0&&cols[j-1][5]===g, nextSame=j<cols.length-1&&cols[j+1][5]===g;info[c[0]]={g,hue:GRP_HUES[gi%GRP_HUES.length],start:!prevSame,end:!nextSame}}});return info}
function grpStyle(gi,head){if(!gi)return'';const t=head?`hsla(${gi.hue},70%,55%,.22)`:`hsla(${gi.hue},70%,60%,.10)`;const bg=head?`linear-gradient(${t},${t}),var(--panel)`:t;const bd=`2px solid hsla(${gi.hue},60%,45%,.75)`;
  return `background:${bg};${gi.start?`border-left:${bd};`:''}${gi.end?`border-right:${bd};`:''}`}
const NO_SUM=new Set(['nday','ncs','q_nd']);
const colSum=k=>rows.reduce((s,r)=>s+(r.type==='sec'?0:num(r[k])),0);
const wireLen=(t,n)=>rows.reduce((s,r)=>s+(r.type==='sec'?0:num(r.kc)*num(r[n])),0);
const FOOT_SPECIAL={day:()=>wireLen('day','nday'),cs:()=>wireLen('cs','ncs')};
function footCells(cols,info){return cols.map(c=>{const gi=info[c[0]];const st=gi?grpStyle(gi,true):'';
  if(FOOT_SPECIAL[c[0]]){const v=FOOT_SPECIAL[c[0]]();return `<td class="ft" data-f="_${c[0]}" style="${st}" title="Tổng chiều dài dây = Σ khoảng cột × số sợi (chưa tính hao hụt)">${v?fmt(v,1)+' m':''}</td>`}
  if(c[3]==='n'&&!NO_SUM.has(c[0])){const v=colSum(c[0]);return `<td class="ft" data-f="${c[0]}" style="${st}">${v?fmt(v,2):''}</td>`}
  return `<td class="ft" style="${st}"></td>`}).join('')}
function refreshFoot(){document.querySelectorAll('#pane [data-f]').forEach(td=>{const k=td.dataset.f;if(k==='_day'||k==='_cs'){const v=FOOT_SPECIAL[k.slice(1)]();td.textContent=v?fmt(v,1)+' m':'';return}const v=k==='_cq'?calcCq().len:colSum(k);td.textContent=v?fmt(v,2):''})}
function headHtml(cols,first,stickyFirst){const info=colGroups(cols);let r1='',r2='';
  for(let j=0;j<cols.length;j++){const c=cols[j],gi=info[c[0]];const sticky=stickyFirst&&j===0?'c1':'';
    if(!gi){r1+=`<th rowspan="2" class="${sticky}" style="min-width:${c[2]}px;width:${c[2]}px">${esc(c[1])}</th>`;continue}
    if(gi.start){let n=1;while(j+n<cols.length&&cols[j+n][5]===gi.g)n++;r1+=`<th colspan="${n}" class="gh1" style="${grpStyle(gi,true)}">${esc(gi.g)}</th>`}
    r2+=`<th class="gh2" style="min-width:${c[2]}px;width:${c[2]}px;${grpStyle(gi,true)}">${esc(c[1])}</th>`}
  return {r1,r2,info}}
// ---- Góc lái: lưu gocD/gocM/gocS/gocH (T|P); chuỗi hiển thị "G2=99°25'53"T" ----
function parseGoc(t){t=String(t||'').trim();if(!t)return null;
  const m=t.match(/^(?:(G[^=\s]*)\s*=\s*)?(\d+(?:[.,]\d+)?)\s*[°º˚o]?\s*(?:(\d+)\s*['’′]?)?\s*(?:(\d+(?:[.,]\d+)?)\s*(?:["”″]|'')?)?\s*([TtPp]|trái|phải|Trái|Phải)?\s*$/);
  if(!m)return null; const h=m[5]?(/^[tT]/.test(m[5])?'T':'P'):'';
  return {ten:m[1]||'',D:m[2].replace(',','.'),M:m[3]||'',S:(m[4]||'').replace(',','.'),H:h}}
function hasGoc(r){return r.type!=='sec'&&(num(r.gocD)||num(r.gocM)||num(r.gocS))}
function gocLabels(){let n=0;return rows.map(r=>{if(!hasGoc(r))return null;if(r.gocTen){const m=r.gocTen.match(/^G(\d+)/);if(m)n=+m[1];return r.gocTen}return 'G'+(++n)})}
function gocStr(r,lab){if(!hasGoc(r))return '';const p=v=>String(Math.round(num(v))).padStart(2,'0');
  return `${lab||''}${lab?'=':''}${Math.round(num(r.gocD))}°${p(r.gocM)}'${p(r.gocS)}"${r.gocH||''}`}
function syncGoc(){const L=gocLabels();rows.forEach((r,i)=>{if(r.type==='sec')return;const s=gocStr(r,L[i]);if(s)r.goc=s;else if(r.gocD!==undefined||r.gocM!==undefined||r.gocS!==undefined)delete r.goc});return L}

const fsCache=new Map(); // path -> {content,mtime,size}
let fsReady=null, fsUnsub=null;
const docId=p=>p.replace(/\//g,'|');
function startFilesListener(){
  if(fsUnsub) fsUnsub();
  fsReady=new Promise((res,rej)=>{let first=true;
    fsUnsub=fdb.collection('files').onSnapshot(snap=>{
      snap.docChanges().forEach(ch=>{const d=ch.doc.data();
        if(ch.type==='removed') fsCache.delete(d.path); else fsCache.set(d.path,{content:d.content||'',mtime:d.mtime||0,size:(d.content||'').length})});
      if(first){first=false;res()} else {try{poll()}catch(e){}}
    },err=>{if(first){first=false;rej(err)} else setStatus('Mất kết nối dữ liệu: '+err.message,true)});
  });
  return fsReady;
}
const fsNF=()=>Object.assign(new Error('Không tìm thấy'),{name:'NotFoundError'});
class FsFile{
  constructor(path,optional){this.kind='file';this.path=path;this.name=path.split('/').pop();this.optional=!!optional}
  async getFile(){const e=fsCache.get(this.path);
    if(!e){if(this.optional)return{lastModified:0,size:0,async text(){return ''}};throw fsNF()}
    return {lastModified:e.mtime,size:e.size,async text(){return e.content}}}
  async createWritable(){let buf='';const self=this;return{async write(x){buf+=x},async close(){
    const mtime=Math.max(Date.now(),(fsCache.get(self.path)?.mtime||0)+1);
    await fdb.collection('files').doc(docId(self.path)).set({path:self.path,dir:self.path.split('/').slice(0,-1).join('/'),content:buf,mtime,by:fbUser?fbUser.uid:''});
    fsCache.set(self.path,{content:buf,mtime,size:buf.length})}}}
}
class FsDir{
  constructor(path,name){this.kind='directory';this.path=path;this.name=name||path.split('/').pop()}
  async getDirectoryHandle(n){return new FsDir(this.path+'/'+n,n)}
  async getFileHandle(n,o){const f=new FsFile(this.path+'/'+n,o&&o.create);if(!(o&&o.create))await f.getFile();return f}
  async *entries(){const pre=this.path+'/';const subs=new Set();
    for(const [p] of fsCache){if(!p.startsWith(pre))continue;const rest=p.slice(pre.length);
      if(rest.includes('/')){const d=rest.split('/')[0];if(!subs.has(d)){subs.add(d);yield [d,new FsDir(pre+d,d)]}}
      else yield [rest,new FsFile(p)]}}
  async removeEntry(n){const p=this.path+'/'+n;await fdb.collection('files').doc(docId(p)).delete();fsCache.delete(p)}
  async queryPermission(){return 'granted'} async requestPermission(){return 'granted'}
}

async function ensureUserDoc(u){
  const ref=fdb.collection('users').doc(u.uid);
  let snap=await ref.get();
  if(snap.exists) return snap.data();
  const ten=window._pendingName||u.displayName||u.email;
  const setup=await fdb.collection('meta').doc('setup').get();
  const base={ten,email:(u.email||'').toLowerCase(),ngayTao:Date.now()};
  if(!setup.exists){ // người đầu tiên = quản lý
    const b=fdb.batch();b.set(fdb.collection('meta').doc('setup'),{uid:u.uid,at:Date.now()});b.set(ref,{...base,vaiTro:'quanly',trangThai:'duyet'});
    try{await b.commit();return {...base,vaiTro:'quanly',trangThai:'duyet'}}catch(e){/* người khác vừa thiết lập */}
  }
  await ref.set({...base,vaiTro:'thanhvien',trangThai:'cho'});
  return {...base,vaiTro:'thanhvien',trangThai:'cho'};
}

async function loadCatalog(){
  try{
    const fh=await dirH.getFileHandle('danh-muc.json',{create:false});
    const {data,mtime}=await readJson(fh); if(mtime!==catMtime){catalog=normCat(data.items);catMtime=mtime;
      const miss=DEFAULT_CAT.filter(d=>['BSO','BBNH'].includes(d.nhom)&&!catalog.some(c=>c.nhom===d.nhom));
      if(miss.length){miss.forEach(d=>catalog.push({...d}));setTimeout(()=>saveCat(true),500)}
      return true}
  }catch(e){ if(e.name==='NotFoundError'){catalog=[];catMtime=0} else setStatus('Lỗi đọc danh mục: '+e.message,true)}
  return false;
}
async function loadList(){
  const pd=await pdir(); const out=[];
  for await (const [name,h] of pd.entries()){
    if(h.kind!=='file'||!name.endsWith('.json')) continue;
    try{
      const f=await h.getFile(); const c=metaCache[name];
      if(c&&c.mtime===f.lastModified){out.push(c.meta);continue}
      const d=JSON.parse(await f.text());
      const meta={id:name.slice(0,-5),name:d.name,tinh:d.tinh,cdt:d.cdt,gd:d.gd,gc:d.gc,updatedAt:d.updatedAt,updatedBy:d.updatedBy,createdBy:d.createdBy,phuTrach:d.phuTrach,trangThai:d.trangThai,han:d.han,isMau:!!d.isMau,len:(d.rows||[]).reduce((s,r)=>s+(r.type==='sec'?0:num(r.kc)),0),nRows:(d.rows||[]).filter(r=>r.type!=='sec'&&(r.cot||r.vt)).length,mtime:f.lastModified};
      metaCache[name]={mtime:f.lastModified,meta}; out.push(meta);
    }catch(e){out.push({id:name.slice(0,-5),name:name+' (file lỗi)',broken:true})}
  }
  projects=out.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  renderList();
  if(curId){const p=projects.find(p=>p.id===curId); if(p){renderHead()} else if(!dirty&&!saving){toast('Dự án đã bị xoá bởi người khác');closeProject()}}
}

async function flushSave(force){
  clearTimeout(saveTimer);
  if((!dirty&&!force)||!curId) return;
  if(saving){saveTimer=setTimeout(()=>flushSave(force),500);return}
  saving=true; const id=curId;
  try{

        ()=>res('mine'),'Ghi đè bằng bản của tôi','Tải bản của họ'); bg.querySelector('[data-x]').onclick=()=>{bg.remove();res('theirs')}});
      if(choice==='theirs'){dirty=false;curMtime=f.lastModified;cur={...theirs,id};cur.thietBi=normCat(cur.thietBi);rows=normRows(theirs.rows||[]);delete cur.rows;rebuildCols();renderHead();renderTab();setStatus('Đã tải bản mới');return}
      saving=true;
    }
    dirty=false;
    const clean=rows.map(r=>{const o={};for(const k in r){if(r[k]!==''&&r[k]!=null)o[k]=r[k]}return o});
    cur.updatedAt=Date.now(); cur.updatedBy=me?.id||myName;
    curMtime=await writeJson(fh,{...cur,id,rows:clean});

  }catch(e){dirty=true;setStatus('Lỗi lưu: '+e.message,true)}
  finally{saving=false}
}

function calcAuto(){
  // khoảng néo số cho từng khoảng cột, khoảng cột đại biểu
  let neoCount=0; const kn=[]; const agg={};
  rows.forEach((r,i)=>{
    if(r.type==='sec'){kn[i]=null;return}
    const kc=num(r.kc);
    if(kc>0){const k=neoCount; kn[i]=k; (agg[k]=agg[k]||{s1:0,s3:0}); agg[k].s1+=kc; agg[k].s3+=kc**3}
    else kn[i]=null;
    if(isNeo(r.cd)) neoCount++;
  });
  const kdb=kn.map(k=>k==null?null:Math.sqrt(agg[k].s3/agg[k].s1));
  // đánh số khoảng néo hiển thị 1..n
  const map={};let n=0; const knd=kn.map(k=>k==null?null:(map[k]??(map[k]=++n)));
  return {kn:knd,kdb};
}
function projCat(){return (cur&&cur.thietBi)||[]}
function effCat(){const p=projCat();return p.length?p:(catalog||[])}
function catIndex(){const m={}; (catalog||[]).forEach(c=>{if(c.ma)m[c.ma]=c}); projCat().forEach(c=>{if(c.ma)m[c.ma]=c}); return m}
const CODE_COLS=()=>COLS.filter(c=>c[3]==='c');
function usageOf(ma){let n=0;rows.forEach(r=>{if(r.type==='sec')return;if(CODE_COLS().some(c=>r[c[0]]===ma))n++});return n}
function calcLietke(){
  const out={}; const add=(ma,q)=>{if(!ma||!q)return; out[ma]=(out[ma]||0)+q};
  const towers=rows.filter(r=>r.type!=='sec');
  towers.forEach(r=>{
    if(r.cot) add(r.cot,1);
    PAIRS.forEach(([a,b])=>add(r[a],num(r[b])));
    add(r.day,num(r.kc)*num(r.nday));
    add(r.cs,num(r.kc)*num(r.ncs));
  });
  const cq=calcCq(); Object.entries(cq.out).forEach(([ma,q])=>add(ma,q));
  const ci=catIndex();
  const base=effCat(); const extra=(catalog||[]).filter(g=>out[g.ma]&&!base.some(x=>x.ma===g.ma));
  const synth=[...CQ_FIXED.map(([,ma,ten,dvt])=>({nhom:'PKCQ',ma,ten,dvt,hh:''})),{nhom:'PKCQ',ma:'GDHN',ten:'Giá đỡ hộp nối cáp quang',dvt:'Cái',hh:''},{nhom:'PKCQ',ma:'RLCQ',ten:'Ru lô cáp quang',dvt:'Cuộn',hh:''}].filter(x=>out[x.ma]&&!ci[x.ma]);
  synth.forEach(x=>ci[x.ma]=x);
  const items=[...base,...extra,...synth].map(c=>({...c,raw:out[c.ma]||0,sl:(out[c.ma]||0)*(1+num(c.hh)/100)}));
  const unknown=Object.keys(out).filter(ma=>!ci[ma]).map(ma=>({ma,sl:out[ma]}));
  const len=towers.reduce((s,r)=>s+num(r.kc),0);
  return {items,unknown,len,th:cq.th,cqLen:cq.len,nRulo:cq.nRulo,nCot:towers.filter(r=>r.cot).length,nNeo:towers.filter(r=>r.cot&&/^Néo/.test(r.cd||'')).length,nDo:towers.filter(r=>r.cot&&/^Đỡ/.test(r.cd||'')).length};
}

function calcCq(){
  // chiều dài cáp từng dòng = khoảng cột + dự phòng + cáp thêm (chỉ dòng có chọn loại cáp)
  const per=rows.map(r=>r.type==='sec'||!r.cq?0:num(r.kc)*(num(r.q_nd)||1)+num(r.q_dp)+num(r.q_them));
  const out={}; const add=(ma,q)=>{if(!ma||!q)return;out[ma]=(out[ma]||0)+q};
  rows.forEach((r,i)=>{if(r.type==='sec')return; add(r.cq,per[i]); add(r.q_hn,num(r.q_qhn)); CQ_FIXED.forEach(([k,ma])=>add(ma,num(r[k])))});
  const nHop=rows.reduce((s,r)=>s+(r.type!=='sec'&&r.q_hn?num(r.q_qhn)||1:0),0);
  // ru lô: cắt đoạn tại vị trí có hộp nối
  const rulo=rows.map(()=>null); let acc=0,nRulo=0,started=false;
  const lastCq=rows.map((r,i)=>r.type!=='sec'&&r.cq?i:-1).filter(i=>i>=0).pop();
  rows.forEach((r,i)=>{if(r.type==='sec')return; if(per[i]){acc+=per[i];started=true}
    if(started&&(r.q_hn||i===lastCq)&&acc>0){rulo[i]={n:++nRulo,len:acc};acc=0}});
  if(nHop) add('GDHN',nHop);
  if(nRulo) add('RLCQ',nRulo);
  const th=CQ_TH.map(([k,ten,dvt])=>({ten,dvt,sl:rows.reduce((s,r)=>s+(r.type==='sec'?0:num(r[k])),0)})).filter(x=>x.sl);
  return {out,th,rulo,nRulo,per,len:per.reduce((a,b)=>a+b,0)};
}

function groupItems(group){let it=effCat().filter(c=>c.nhom===group&&c.ma);if(!it.length&&projCat().length)it=(catalog||[]).filter(c=>c.nhom===group&&c.ma);return it}

}
function cellHtml(r,i,[k,h,w,kind,g]){

    return `<td style="background:var(--sec)"></td>`;
  }

    const ok=!v||groupItems(g).some(c=>c.ma===v);

  if(kind==='cd') return `<td><select ${ro} data-i="${i}" data-k="cd"><option value=""></option>${CD_OPTS.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}${v&&!CD_OPTS.includes(v)?`<option selected>${esc(v)}</option>`:''}</select></td>`;
  return `<td class="${k==='vt'?'c1':''} ${gs?'grp':''}"${gs}><input ${ro} class="${kind==='n'?'n':''}" data-i="${i}" data-k="${k}" value="${esc(v)}" inputmode="${kind==='n'?'decimal':'text'}"></td>`;
}

  <div style="overflow:auto;max-height:calc(100vh - 290px);border:1px solid var(--line);border-radius:6px">

    ${HH.r1}
    <th rowspan="2" class="g" style="min-width:56px">Khoảng néo</th><th rowspan="2" class="g" style="min-width:70px">K/c đại biểu (m)</th><th rowspan="2" style="min-width:78px"></th></tr><tr>${HH.r2}</tr></thead>

     <td class="auto" data-kn="${i}">${a.kn[i]??''}</td><td class="auto" data-kdb="${i}">${a.kdb[i]!=null?a.kdb[i].toFixed(1):''}</td>
     <td class="ctl"><div class="rowbtns">${canWrite?`<button data-a="ins" data-i="${i}" title="Chèn dòng bên dưới">＋</button><button data-a="up" data-i="${i}" title="Lên">↑</button><button data-a="dn" data-i="${i}" title="Xuống">↓</button><button data-a="del" data-i="${i}" title="Xoá dòng">✕</button>`:''}</div></td></tr>`).join('')}
  ${!rows.length?`<tr><td colspan="${COLS.length+4}" class="empty">Chưa có vị trí nào. Thêm dòng hoặc dán từ Excel.</td></tr>`:''}
  </tbody><tfoot><tr><td class="ft c0">Tổng</td><td class="ft c1">${rows.filter(r=>r.type!=='sec'&&(r.cot||r.vt)).length} VT</td>${footCells(COLS.slice(1),HH.info)}<td class="ft"></td><td class="ft"></td><td class="ft"></td></tr></tfoot></table></div>
  <div class="tbar">${canWrite?`<button id="addRow">+ Thêm vị trí</button><button id="add5">+ 5 vị trí</button><button id="addSec">+ Dòng đoạn tuyến</button><button id="paste">Dán từ Excel…</button><button id="colMgr">⚙ Thêm / sửa cột thiết bị…</button>`:''}</div>`;
  const tb=pane.querySelector('tbody');
  tb.addEventListener('input',onCellInput);
  tb.addEventListener('change',onCellInput);
  tb.addEventListener('click',onRowBtn);
  if(canWrite) tb.addEventListener('contextmenu',e=>{const tr=e.target.closest('tr');if(!tr||!tr.parentElement)return;const i=[...tr.parentElement.children].indexOf(tr);if(i<0||i>=rows.length)return;e.preventDefault();rowMenu(i,e.clientX,e.clientY)});
  tb.addEventListener('keydown',onKey);
  if(canWrite){
    $('#addRow').onclick=()=>{rows.push({id:uid()});scheduleSave();renderGrid(pane);focusCell(rows.length-1,'vt')};

    $('#addSec').onclick=()=>{rows.push({id:uid(),type:'sec'});scheduleSave();renderGrid(pane);focusCell(rows.length-1,'vt')};
    $('#paste').onclick=pasteDialog;

function focusCell(i,k){if(k==='goc')k='gocD';const el=document.querySelector(`#pane [data-i="${i}"][data-k="${k}"]`);if(el){el.focus();el.scrollIntoView({block:'nearest'})}}
function onCellInput(e){
  const el=e.target; if(!el.dataset||el.dataset.i==null) return;
  const i=+el.dataset.i,k=el.dataset.k; rows[i][k]=el.value;
  if(el.tagName==='SELECT'){const c=COLS.find(c=>c[0]===k); if(c&&c[3]==='c') el.parentElement.classList.remove('bad')}
  scheduleSave();
  if(/^goc[DMSH]$/.test(k)){
    if(k==='gocM'||k==='gocS'){const v=num(el.value);el.style.color=v>=60?'var(--warn)':''}
    if(k==='gocD'){const v=num(el.value);el.style.color=v>180?'var(--warn)':''}
    window._gocL=syncGoc();rows.forEach((r,j)=>{const x=document.querySelector(`[data-gl="${j}"]`);if(x)x.textContent=window._gocL[j]?window._gocL[j]+'=':'';const b=x&&x.parentElement;if(b)b.title=gocStr(r,window._gocL[j])});
  }
  if(['kc','cd'].includes(k)) refreshAuto();
  if(el.tagName==='INPUT'&&el.classList.contains('n')) refreshFoot();
  if(['kc','cot','cd'].includes(k)) refreshKpi();
}
function refreshAuto(){const a=calcAuto();rows.forEach((r,i)=>{const x=document.querySelector(`[data-kn="${i}"]`),y=document.querySelector(`[data-kdb="${i}"]`);if(x)x.textContent=a.kn[i]??'';if(y)y.textContent=a.kdb[i]!=null?a.kdb[i].toFixed(1):''})}
function refreshKpi(){const lk=calcLietke();const a=$('#kLen'),b=$('#kCot'),c=$('#kNeo');if(a)a.textContent=fmt(lk.len,1);if(b)b.textContent=lk.nCot;if(c)c.textContent=lk.nNeo+' / '+lk.nDo}
function rowAction(a,i,n){
  const pane=$('#pane'); let focusAt=null;
  if(a==='insAbove'){rows.splice(i,0,...Array.from({length:n||1},()=>({id:uid()})));focusAt=i}
  else if(a==='ins'){rows.splice(i+1,0,...Array.from({length:n||1},()=>({id:uid()})));focusAt=i+1}
  else if(a==='secAbove'){rows.splice(i,0,{id:uid(),type:'sec'});focusAt=i}
  else if(a==='dupRow'){const c={...rows[i],id:uid()};rows.splice(i+1,0,c);focusAt=i+1}
  else return false;
  scheduleSave(); renderGrid(pane);
  if(focusAt!=null){const tr=pane.querySelectorAll('tbody tr')[focusAt]; if(tr){tr.classList.add('flash')} focusCell(focusAt,'vt')}
  return true;
}
function insManyDialog(i,above){
  modal(`<h3>Chèn nhiều dòng</h3><label>Số dòng</label><input id="f_n" type="number" min="1" max="200" value="5"><label>Vị trí</label><select id="f_w"><option value="ins" ${above?'':'selected'}>Phía dưới dòng ${i+1}</option><option value="insAbove" ${above?'selected':''}>Phía trên dòng ${i+1}</option></select>`,
    bg=>{const n=Math.max(1,Math.min(200,parseInt(bg.querySelector('#f_n').value)||0));if(!n){showErr(bg,'Nhập số dòng');return false}rowAction(bg.querySelector('#f_w').value,i,n)},'Chèn');
}
function rowMenu(i,x,y){
  document.querySelectorAll('.cmenu').forEach(m=>m.remove());
  const r=rows[i]; const m=document.createElement('div'); m.className='cmenu';
  m.innerHTML=`<button data-m="insAbove">Chèn 1 dòng phía trên</button>
   <button data-m="ins">Chèn 1 dòng phía dưới <small>Ctrl+Enter</small></button>
   <button data-m="many">Chèn nhiều dòng…</button>
   <button data-m="secAbove">Chèn dòng đoạn tuyến phía trên</button>
   <button data-m="dupRow">Nhân bản dòng này</button><hr>
   <button data-m="up" ${i===0?'disabled':''}>Chuyển lên</button>
   <button data-m="dn" ${i===rows.length-1?'disabled':''}>Chuyển xuống</button><hr>
   <button data-m="del" class="danger">Xoá dòng ${esc(r.vt||'')}</button>`;
  document.body.appendChild(m);
  const w=m.offsetWidth,h=m.offsetHeight; m.style.left=Math.min(x,innerWidth-w-8)+'px'; m.style.top=Math.min(y,innerHeight-h-8)+'px';
  const close=()=>{m.remove();document.removeEventListener('mousedown',out,true);document.removeEventListener('keydown',esc_)};
  const out=e=>{if(!m.contains(e.target))close()}; const esc_=e=>{if(e.key==='Escape')close()};
  setTimeout(()=>{document.addEventListener('mousedown',out,true);document.addEventListener('keydown',esc_)},0);
  m.onclick=e=>{const b=e.target.closest('[data-m]');if(!b||b.disabled)return;close();const a=b.dataset.m;
    if(a==='many') return insManyDialog(i,false);
    if(rowAction(a,i)) return;
    onRowBtn({target:{closest:()=>({dataset:{a,i:String(i)}})}});
  };
}
function onRowBtn(e){
  const b=e.target.closest('button[data-a]'); if(!b) return; const i=+b.dataset.i;
  if(b.dataset.a==='menu'){const rc=b.getBoundingClientRect?b.getBoundingClientRect():{left:0,bottom:0};rowMenu(i,rc.left,rc.bottom+2);return}
  if(rowAction(b.dataset.a,i)) return;
  if(b.dataset.a==='up'&&i>0) [rows[i-1],rows[i]]=[rows[i],rows[i-1]];
  if(b.dataset.a==='dn'&&i<rows.length-1) [rows[i+1],rows[i]]=[rows[i],rows[i+1]];
  if(b.dataset.a==='del'){const r=rows[i]; const filled=Object.keys(r).filter(k=>k!=='id'&&k!=='type'&&r[k]!=='').length;
    if(filled>2){modal(`<h3>Xoá dòng ${esc(r.vt||'')}?</h3><p>Dòng này đang có dữ liệu.</p>`,()=>{rows.splice(i,1);scheduleSave();renderGrid($('#pane'))},'Xoá');return}
    rows.splice(i,1)}
  scheduleSave(); renderGrid($('#pane'));
}
function onKey(e){
  const el=e.target; if(el.dataset.i==null) return;
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&canWrite){e.preventDefault();const i=+el.dataset.i,k=el.dataset.k;rows.splice(i+1,0,{id:uid()});scheduleSave();renderGrid($('#pane'));focusCell(i+1,k);return}
  const i=+el.dataset.i,k=el.dataset.k;
  if(e.key==='Enter'||(e.key==='ArrowDown'&&el.tagName==='INPUT')){e.preventDefault();let j=i+1;while(j<rows.length&&rows[j].type==='sec'&&!['vt','gc'].includes(k))j++; if(j>=rows.length&&e.key==='Enter'&&canWrite){rows.push({id:uid()});scheduleSave();renderGrid($('#pane'))} focusCell(Math.min(j,rows.length-1),k)}
  if(e.key==='ArrowUp'&&el.tagName==='INPUT'){e.preventDefault();let j=i-1;while(j>0&&rows[j].type==='sec'&&!['vt','gc'].includes(k))j--;focusCell(Math.max(j,0),k)}
}

    async()=>{

    const out=lines.map(l=>{
      const cells=l.split('\t'); const r={id:uid()};
      COLS.forEach(([k],j)=>{const v=(cells[j]??'').trim(); if(v!=='') r[k]=v});
      if(/^[A-Z]{1,2}$/.test(r.vt||'')&&!r.cot){return {id:r.id,type:'sec',vt:r.vt,gc:r.gc||cells.slice(1).find(x=>x.trim())||''}}

      // tách mã kiểu cũ
      const qk={n1:'qn1',n2:'qn2',d1:'qd1',kdvT:'kdv',crT:'cr',crcsT:'crcs',mong:'qmong',bl:'qbl',td:'qtd',bso:'qbso',bbnh:'qbbnh'};
      for(const [a,b] of Object.entries(qk)){
        const v=r[a]; if(!v||r[b]) continue;
        const m=String(v).match(/^(\d+(?:[.,]\d+)?)\s*(.+)$/);
        if(m&&!ci[v]){r[a]=m[2].trim();r[b]=m[1].replace(',','.')} else if(ci[v]) r[b]=r[b]||'1';
      }
      for(const a of ['day','cs']){const v=r[a];const m=v&&String(v).match(/^(\d+)\s*([A-Za-z].+)$/);if(m&&!ci[v]){r[a]=m[2].trim();if(!r[a==='day'?'nday':'ncs'])r[a==='day'?'nday':'ncs']=m[1]}}
      return r;
    });
    if(mode==='replace') rows=out; else rows.push(...out);

/* ---------------- Nhập từ file Excel bảng kê ---------------- */
const TCVN_SRC="¸µ¶·¹¨¾»¼½Æ©ÊÇÈÉËÐÌÎÏÑªÕÒÓÔÖÝ×ØÜÞãßáâä«èåæçé¬íêëìîóïñòô­øõö÷ùýúûüþ®¡¢§£¤¥¦";
const TCVN_DST="áàảãạăắằẳẵặâấầẩẫậéèẻẽẹêếềểễệíìỉĩịóòỏõọôốồổỗộơớờởỡợúùủũụưứừửữựýỳỷỹỵđĂÂĐÊÔƠƯ";
const TCVN_MAP=Object.fromEntries([...TCVN_SRC].map((c,i)=>[c,TCVN_DST[i]]));
const TCVN_ONLY=/[¸µ¶·¹¨¾»¼½Æ©ÊÇÈÉËÐÌÎÏÑªÕÒÓÔÖ×ØÜÞßä«åæç¬îïñôøöùûüþ®¡¢§£¤¥¦­]/;
const UNI_VN=/[ĂăĐđƠơƯưẠ-ỹ]/;
let SHEET_TCVN=false;
function vn(s){ if(typeof s!=='string') return s; s=s.replace(/\u00a0/g,' ').trim(); if(!s) return s;
  const cellUni=UNI_VN.test(s);
  if(!cellUni&&!TCVN_ONLY.test(s)&&!SHEET_TCVN) return s;
  return s.split(/(\s+)/).map(w=>{
    if(!w.trim()||UNI_VN.test(w)) return w;
    const tc=TCVN_ONLY.test(w)||(!cellUni&&SHEET_TCVN&&/[\u00c0-\u00ff]/.test(w));
    if(!tc) return w;
    let r=[...w].map(c=>TCVN_MAP[c]||c).join('');
    const letters=w.replace(/[^A-Za-z]/g,''); if(letters.length>=2&&letters===letters.toUpperCase()) r=r.toUpperCase();
    return r}).join('');
}
const low=s=>vn(String(s??'')).toLowerCase().replace(/\s+/g,' ').trim();
const splitQty=v=>{v=vn(String(v??'')).trim();if(!v)return null;const m=v.match(/^(\d+(?:[.,]\d+)?)\s*([^\d\s].*)$/);return m?{q:parseFloat(m[1].replace(',','.')),c:m[2].trim()}:{q:1,c:v}};

function sheetAoa(wb,name){const a=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:''});
  let t=0,u=0; for(const r of a.slice(0,400))for(const v of r){if(typeof v!=='string')continue;if(UNI_VN.test(v))u++;else if(TCVN_ONLY.test(v))t++}
  SHEET_TCVN=t>0&&t>=u*0.3; return a}
// gộp tiêu đề nhiều tầng: mỗi cột → chuỗi "nhóm | tiêu đề | phụ đề"
function headerLabels(aoa,h0,h1){
  const n=Math.max(...aoa.slice(h0,h1+1).map(r=>r.length));const lab=Array(n).fill('');
  for(let r=h0;r<=h1;r++){let carry='';const row=aoa[r]||[];
    for(let c=0;c<n;c++){const v=low(row[c]);if(v&&!/^\d+$/.test(v))carry=v; else if(v)carry=''; // ô số = dòng đánh số cột
      const t=v&&!/^\d+$/.test(v)?v:(r===h0?carry:'');if(t)lab[c]+=(lab[c]?' | ':'')+t}}
  return lab;
}
function findRow(aoa,tests,maxRow=40){for(let r=0;r<Math.min(aoa.length,maxRow);r++){const t=(aoa[r]||[]).map(low).join(' ¦ ');if(tests.every(x=>x.test(t)))return r}return -1}

function detectSheets(wb){
  const hidden=(wb.Workbook&&wb.Workbook.Sheets||[]).map(s=>s.Hidden);
  const res={tk:[],cq:[]};
  wb.SheetNames.forEach((n,i)=>{let a;try{a=sheetAoa(wb,n)}catch(e){return}
    const tk=findRow(a,[/ký hiệu cột|loại cột/,/công dụng/,/khoảng cột/]);
    const isCq=findRow(a,[/khoảng cột/,/hộp nối|cáp quang/])>=0 && findRow(a,[/khoá|khóa/])>=0;
    const score=(hidden[i]?0:5)+(/tongke|tổng kê|tong ke|bang ke/i.test(n)?3:0)+(/2|ht|cải tạo/i.test(n)?-2:0);
    if(isCq) res.cq.push({n,score:score+(/cq|quang/i.test(n)?5:0),hidden:!!hidden[i]});
    else if(tk>=0) res.tk.push({n,score:score+(/1$/.test(n)?1:0),hidden:!!hidden[i]});
  });
  res.tk.sort((a,b)=>b.score-a.score);res.cq.sort((a,b)=>b.score-a.score);
  return res;
}
function titleName(aoa){for(let r=0;r<5;r++){for(const v of aoa[r]||[]){const t=vn(String(v||''));const m=t.match(/dự án\s*:?\s*(.+)/i);if(m)return m[1].replace(/\s+/g,' ').trim()}}return ''}
const isCode=v=>/[A-Za-zĐđ]/.test(v)&&/\d/.test(v);

function parseTongke(aoa){
  const h=findRow(aoa,[/ký hiệu cột|loại cột/,/công dụng/]);
  if(h<0) throw new Error('Không thấy dòng tiêu đề (cần có “Ký hiệu cột/Loại cột” và “Công dụng”).');
  // tầng tiêu đề: tới trước dòng dữ liệu đầu tiên (tối đa 4 dòng)
  const hrow=(aoa[h]||[]).map(low); const cCot=hrow.findIndex(t=>/ký hiệu cột|loại cột/.test(t));
  let h1=h; for(let r=h+1;r<=h+3&&r<aoa.length;r++){const c=low((aoa[r]||[])[cCot]);
    if(c===''||/^\d+$/.test(c)||(!isCode(c)&&!/\d/.test(c)))h1=r; else break}
  const lab=headerLabels(aoa,h,h1);
  const col={}; const chuoi=[],chuoiCS=[],kdv=[],note={};
  let stop=lab.length;
  lab.forEach((t,c)=>{if(c>=stop)return;
    if(/ghi chú/.test(t)&&col.gc==null){col.gc=c;stop=c+1;return}
    if(/stt cột|số tt cột|^cột$|stt \| cột/.test(t)&&col.vt==null)col.vt=c;
    else if(/ký hiệu cột|loại cột/.test(t)&&col.cot==null)col.cot=c;
    else if(/công dụng/.test(t)&&col.cd==null)col.cd=c;
    else if(/góc lái/.test(t)&&col.goc==null)col.goc=c;
    else if(/^khoảng cột$|khoảng cột \(m\)|^k\/c(ột)?$/.test(t)&&col.kc==null)col.kc=c;
    else if(/đại biểu|khoảng néo|cao/.test(t)){}
    else if(/cách điện|chuỗi/.test(t)){(/cs|chống sét/.test(t)?chuoiCS:chuoi).push(c)}
    else if(/^dây dẫn/.test(t)&&col.day==null)col.day=c;
    else if(/khung định vị|kđv/.test(t))kdv.push(c);
    else if(/dây lèo/.test(t))note.leo=c;
    else if(/chống rung/.test(t)){if(/cs|chống sét/.test(t))col.crcs=col.crcs??c;else col.cr=col.cr??c}
    else if(/móng néo/.test(t))note.mongneo=c;
    else if(/móng/.test(t)&&col.mong==null)col.mong=c;
    else if(/bu l/.test(t)&&col.bl==null)col.bl=c;
    else if(/tiếp đ/.test(t)&&col.td==null)col.td=c;
    else if(/tạ bù/.test(t))note.tabu=c;
    else if(/biển số|số thứ tự/.test(t)&&col.bso==null)col.bso=c;
    else if(/nguy hiểm/.test(t)&&col.bbnh==null)col.bbnh=c;
    else if(/phụ kiện/.test(t))note.pk=c;
    else if(/dây cs|dây chống sét/.test(t)&&col.cs==null)col.cs=c;
  });
  if(col.vt==null){ // cột tên vị trí: cột ngay trước "Ký hiệu cột" nếu không có tiêu đề riêng
    col.vt=col.cot!=null&&col.cot>0?col.cot-1:0 }
  if(col.cot==null) throw new Error('Không xác định được cột “Loại cột”.');
  const NOTE_NAME={leo:'Dây lèo',mongneo:'Móng néo',tabu:'Tạ bù',pk:'Phụ kiện'};
  const out=[]; let empty=0, started=false;
  for(let r=h1+1;r<aoa.length;r++){
    const row=aoa[r]||[]; const g=c=>c==null?'':vn(String(row[c]??'')).trim();
    const vt=g(col.vt), cot=g(col.cot), cd=g(col.cd);
    if(/^tổng|^cộng/i.test(vt)||/^tổng|^cộng/i.test(cot)) break;
    if(!vt&&!cot){ if(started&&++empty>=4)break; continue } empty=0;
    if(/^\d+$/.test(cot)) continue; // dòng đánh số cột
    if(/^([A-Z]|[IVX]+)$/.test(vt)&&!cd&&(!isCode(cot)||/\s/.test(cot)&&cot.length>14)){started=true;out.push({id:uid(),type:'sec',vt,gc:cot||g(col.gc)});continue}
    if(!isCode(cot)&&!/\d/.test(vt)) continue; // dòng tiêu đề phụ / ghi chú
    started=true;
    const R={id:uid(),vt,cot,cd}; const notes=[];
    {const gg=parseGoc(g(col.goc)); if(gg&&num(gg.D)){R.gocD=gg.D;R.gocM=gg.M;R.gocS=gg.S;R.gocH=gg.H;if(gg.ten)R.gocTen=gg.ten}}
    const kc=num(row[col.kc]); if(col.kc!=null&&kc) R.kc=String(+kc.toFixed(2));
    const d=splitQty(g(col.day)); if(d){R.day=d.c;R.nday=String(d.q)}
    const cs=splitQty(g(col.cs)); if(cs){R.cs=cs.c;R.ncs=String(cs.q)}
    // chuỗi dây dẫn: néo → n1,n2; đỡ → d1
    const slots={n:['n1','n2'],d:['d1']};
    chuoi.forEach(c=>{const x=splitQty(g(c));if(!x||!x.q)return;const kind=/^[DĐ]/i.test(x.c)?'d':'n';
      const k=(slots[kind]||[]).find(k=>!R[k]||R[k]===x.c);
      if(k){if(R[k]===x.c)R['q'+k]=String(num(R['q'+k])+x.q);else{R[k]=x.c;R['q'+k]=String(x.q)}}
      else notes.push(`Chuỗi ${x.q}${x.c}`)});
    chuoiCS.forEach(c=>{const x=splitQty(g(c));if(x&&x.q)notes.push(`Chuỗi dây CS ${x.q}${x.c}`)});
    kdv.forEach(c=>{const x=splitQty(g(c));if(!x||!x.q)return;if(!R.kdvT||R.kdvT===x.c){R.kdvT=x.c;R.kdv=String(num(R.kdv)+x.q)}else notes.push(`KĐV ${x.q}${x.c}`)});
    [['cr','crT','cr'],['crcs','crcsT','crcs']].forEach(([src,t,q])=>{const x=splitQty(g(col[src]));if(x&&x.q){R[t]=x.c;R[q]=String(x.q)}});
    [['mong','mong','qmong'],['bl','bl','qbl'],['td','td','qtd'],['bso','bso','qbso'],['bbnh','bbnh','qbbnh']].forEach(([src,k,q])=>{const x=splitQty(g(col[src]));if(x&&x.q){R[k]=x.c;R[q]=String(x.q)}});
    Object.entries(note).forEach(([k,c])=>{const v=g(c);if(v&&v!=='0')notes.push(`${NOTE_NAME[k]}: ${v}`)});
    const gc=g(col.gc); R.gc=[gc,...notes].filter(Boolean).join('; ');
    Object.keys(R).forEach(k=>{if(R[k]===''||R[k]==null)delete R[k]});
    out.push(R);
  }
  return {rows:out,col,notesUsed:Object.keys(note).map(k=>NOTE_NAME[k]).concat(chuoiCS.length?['Chuỗi dây CS']:[])};
}

function parseCq(aoa){
  const h=findRow(aoa,[/loại cột|ký hiệu cột/,/khoảng cột/]);
  if(h<0) throw new Error('Sheet cáp quang: không thấy dòng tiêu đề.');
  let h1=h; for(let r=h+1;r<=h+3&&r<aoa.length;r++){const txt=(aoa[r]||[]).map(low).filter(Boolean);if(txt.length&&txt.every(t=>!/\d/.test(t)||/^\d+$/.test(t)))h1=r;else break}
  // nhóm "Phụ kiện"/"Phần thu hồi" lấy từ dòng tiêu đề trên cùng, mở rộng sang phải
  const lab=headerLabels(aoa,h,h1); const col={};
  lab.forEach((t,c)=>{
    const th=/thu hồi/.test(t); const pre=th?'th_':'q_';
    if(/ghi chú/.test(t)){col.gc=col.gc??c;return}
    if(/số tt|stt/.test(t)){(col._vt=col._vt||[]).push(c)}
    else if(/loại cột|ký hiệu cột/.test(t)&&col.cot==null)col.cot=c;
    else if(/khoảng cột/.test(t)&&col.kc==null)col.kc=c;
    else if(/dự phòng/.test(t))col.q_dp=col.q_dp??c;
    else if(/thêm/.test(t))col.q_them=col.q_them??c;
    else if(/hộp nối/.test(t))col.q_hn=col.q_hn??c;
    else if(/néo/.test(t)&&/kho/.test(t))col[pre+'kn']=col[pre+'kn']??c;
    else if(/đỡ/.test(t)&&/kho/.test(t))col[pre+'kd']=col[pre+'kd']??c;
    else if(/lèo/.test(t))col[pre+'kl']=col[pre+'kl']??c;
    else if(/kẹp/.test(t))col[pre+'kc']=col[pre+'kc']??c;
    else if(/chống/.test(t)&&/rung/.test(t))col[pre+'cr']=col[pre+'cr']??c;
  });
  { const cands=col._vt||[]; const filled=c=>aoa.slice(h1+1,h1+60).filter(r=>String((r||[])[c]??'').trim()).length;
    col.vt=cands.sort((a,b)=>filled(b)-filled(a))[0]; if(col.vt==null&&col.cot!=null)col.vt=col.cot-1 }
  // Excel mẫu gộp ô "Khoá/néo" ở 2 dòng → nếu phân loại thiếu, đọc theo thứ tự 5 cột sau hộp nối
  if(col.q_hn!=null&&col.q_kn==null){['q_kn','q_kd','q_kl','q_kc','q_cr','th_kn','th_kd','th_kl','th_kc','th_cr'].forEach((k,j)=>col[k]=col.q_hn+1+j)}
  const out=[]; let empty=0;
  for(let r=h1+1;r<aoa.length;r++){const row=aoa[r]||[];const g=c=>c==null?'':vn(String(row[c]??'')).trim();
    const vt=g(col.vt),cot=g(col.cot); if(/^tổng|^cộng/i.test(vt))break;
    if(!vt&&!cot){if(out.length&&++empty>=4)break;continue}empty=0;
    if(/^\d+$/.test(cot))continue;
    const R={vt,cot}; ['q_dp','q_them','q_kn','q_kd','q_kl','q_kc','q_cr','th_kn','th_kd','th_kl','th_kc','th_cr'].forEach(k=>{const v=num(row[col[k]]);if(col[k]!=null&&v)R[k]=String(v)});
    const hn=splitQty(g(col.q_hn)); if(hn&&hn.q){R.q_hn=hn.c;R.q_qhn=String(hn.q)}
    const gc=g(col.gc); if(gc)R.q_gc=gc;
    out.push(R);
  }
  return out;
}
function mergeCq(rows,cq,cable){
  let hit=0; const used=new Set();
  const key=s=>String(s||'').replace(/\s+/g,'').toLowerCase();
  cq.forEach(c=>{
    let i=rows.findIndex((r,j)=>!used.has(j)&&r.type!=='sec'&&key(r.vt)===key(c.vt)&&(!c.cot||!r.cot||key(r.cot)===key(c.cot)));
    if(i<0) i=rows.findIndex((r,j)=>!used.has(j)&&r.type!=='sec'&&(key(r.vt)===key(c.cot)||(c.cot&&key(r.cot)===key(c.cot)&&key(r.vt)===key(c.vt))));
    if(i<0) return; used.add(i); hit++;
    const {vt,cot,...rest}=c; Object.assign(rows[i],rest);
    if(cable&&num(rows[i].kc)) rows[i].cq=cable;
  });
  if(cable) rows.forEach((r,j)=>{if(r.type!=='sec'&&used.has(j)===false&&!r.cq){}}); 
  return hit;
}
function normCodes(rows){
  const all=[...(catalog||[]),...projCat()]; const key=x=>String(x).replace(/\s+/g,'').toUpperCase();
  const m={}; all.forEach(c=>{if(c.ma)m[key(c.ma)]=c.ma});
  rows.forEach(r=>{if(r.type==='sec')return;[...COLS,...CQ_COLS].filter(c=>c[3]==='c').forEach(([k])=>{if(r[k]&&m[key(r[k])])r[k]=m[key(r[k])]})});
}
function groupOfField(k){const c=[...COLS,...CQ_COLS].find(x=>x[0]===k&&x[3]==='c');return c?c[4]:null}
function codesIn(rows){const m=new Map();rows.forEach(r=>{if(r.type==='sec')return;[...COLS,...CQ_COLS].filter(c=>c[3]==='c').forEach(([k,,,,g])=>{if(r[k]&&!m.has(r[k]))m.set(r[k],g)})});return m}

    $b('#f_stk').innerHTML=opt(det.tk,'(không nhập)'); $b('#f_scq').innerHTML=opt(det.cq,'(không nhập)');
    const cabs=[...(catalog||[]),...projCat()].filter(c=>c.nhom==='CQ'&&c.ma).map(c=>c.ma);
    $b('#f_cab').innerHTML='<option value="">(không gán)</option>'+[...new Set(cabs)].map((c,i)=>`<option ${i===0?'selected':''}>${esc(c)}</option>`).join('');
    let nm=''; try{if(det.tk[0])nm=titleName(sheetAoa(wb,det.tk[0].n))}catch(e){}
    $b('#f_pn').value=nm?nm.replace(/^./,c=>c.toUpperCase()):fileName;
    $b('#f_mode').value='new';
    $b('#f_newname').style.display=$b('#f_mode').value==='new'?'':'none';
    $b('#imp_opts').style.display='';
    ['#f_stk','#f_scq','#f_cab'].forEach(s=>$b(s).onchange=preview);
    preview();
  };
}

/* ---------------- Xuất Excel ---------------- */
function hslHex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return [f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('').toUpperCase()}
function loadScript(src){return new Promise((res,rej)=>{if([...document.scripts].some(s=>s.src===src))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Không tải được '+src));document.head.appendChild(s)})}
function sectionStats(){
  const out=[]; let cur={ten:'',len:0,nCot:0,nNeo:0,nDo:0};
  const push=()=>{if(cur.len||cur.nCot||cur.ten)out.push(cur)};
  rows.forEach(r=>{
    if(r.type==='sec'){push();cur={ten:[r.vt,r.gc].filter(Boolean).join('. '),len:0,nCot:0,nNeo:0,nDo:0};return}
    cur.len+=num(r.kc); if(r.cot){cur.nCot++; if(/^Néo/.test(r.cd||''))cur.nNeo++; else if(/^Đỡ/.test(r.cd||''))cur.nDo++}
  }); push();
  if(out.length===1&&!out[0].ten) out[0].ten='Toàn tuyến';
  out.forEach(o=>{if(!o.ten)o.ten='(Chưa thuộc đoạn nào)'});
  return out;
}
async function exportXlsx(){
  try{ await loadScript('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js') }
  catch(e){ toast('Chưa tải được thư viện Excel (cần có mạng) – thử lại sau'); return }
  syncGoc();
  const a=calcAuto(), lk=calcLietke(), secs=sectionStats(), cqc=calcCq();
  const F='Arial';
  const thin={style:'thin',color:{argb:'FF000000'}};
  const box={top:thin,left:thin,bottom:thin,right:thin};
  const wb=new ExcelJS.Workbook(); wb.creator=myName||''; wb.created=new Date();
  const title=(ws,r,text,ncol,size=12)=>{ws.mergeCells(r,1,r,ncol);const c=ws.getCell(r,1);c.value=text;c.font={name:F,size,bold:true};c.alignment={horizontal:'center',vertical:'middle',wrapText:true};ws.getRow(r).height=size>12?24:20};
  const headRow=(ws,r,vals,height=36)=>{const row=ws.getRow(r);vals.forEach((v,j)=>{const c=row.getCell(j+1);c.value=v;c.font={name:F,size:10,bold:true};c.alignment={horizontal:'center',vertical:'middle',wrapText:true};c.border=box;c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF2F2F2'}}});row.height=height};
  const numRow=(ws,r,n)=>{const row=ws.getRow(r);for(let j=1;j<=n;j++){const c=row.getCell(j);c.value=j;c.font={name:F,size:9,italic:true};c.alignment={horizontal:'center'};c.border=box}};
  const dataRow=(ws,r,vals,opt={})=>{const row=ws.getRow(r);const left=new Set(opt.left||[]);vals.forEach((v,j)=>{const c=row.getCell(j+1);
      if(typeof v==='number')v=Math.round(v*100)/100;
      c.value=(v===''||v==null)?null:v;c.font={name:F,size:opt.size||10,bold:!!opt.bold};c.border=box;
      c.alignment={horizontal:left.has(j)?'left':'center',vertical:'middle',wrapText:true};
      if(typeof v==='number')c.numFmt=Number.isInteger(v)?'#,##0':'#,##0.##';
      if(opt.fill)c.fill={type:'pattern',pattern:'solid',fgColor:{argb:opt.fill}}});return row};
  const page=(ws,orientation,size,rep)=>{ws.pageSetup={paperSize:size,orientation,fitToPage:true,fitToWidth:1,fitToHeight:0,horizontalCentered:true,
      margins:{left:0.4,right:0.4,top:0.6,bottom:0.6,header:0.3,footer:0.3},printTitlesRow:rep};
    ws.headerFooter={oddFooter:'&L&"Arial"&8'+(cur.name||'').replace(/&/g,'&&')+'&R&"Arial"&8Trang &P/&N'}};
  const nv=v=>v===''||v==null?'':(isNaN(num(v))?v:num(v));
  // tiêu đề 2 tầng: nhóm (gộp ô) + SL/Loại; cột lẻ gộp dọc
  const head2=(ws,r,lead,cols,tail)=>{
    const all=[...lead.map(l=>[l,null]),...cols.map(c=>[c[1],c[5]||null]),...tail.map(l=>[l,null])];
    headRow(ws,r,all.map(([l,g])=>g||l),24); headRow(ws,r+1,all.map(([l,g])=>g?l:''),30);
    for(let j=0;j<all.length;){const g=all[j][1];
      if(!g){ws.mergeCells(r,j+1,r+1,j+1);j++;continue}
      let n=1;while(j+n<all.length&&all[j+n][1]===g)n++; if(n>1)ws.mergeCells(r,j+1,r,j+n);
      const hue=GRP_HUES[[...new Set(all.map(x=>x[1]).filter(Boolean))].indexOf(g)%GRP_HUES.length];
      const col='FF'+hslHex(hue,70,88);
      for(let t=0;t<n;t++){[r,r+1].forEach(rr=>{ws.getCell(rr,j+1+t).fill={type:'pattern',pattern:'solid',fgColor:{argb:col}}})}
      j+=n}
  };
  const projTitle=`DỰ ÁN: ${(cur.name||'').toUpperCase()}`;

  /* ---- Sheet Liệt kê ---- */
  const wl=wb.addWorksheet('Lietke',{views:[{showGridLines:false}]});
  wl.columns=[{width:7},{width:46},{width:18},{width:9},{width:14},{width:26}];
  title(wl,1,'LIỆT KÊ VẬT LIỆU PHẦN ĐƯỜNG DÂY',6,13); title(wl,2,projTitle,6,11);
  let r=4;
  const s1=wl.getCell(r,1);s1.value='I. CHIỀU DÀI TUYẾN THEO ĐOẠN';s1.font={name:F,size:11,bold:true};r++;
  headRow(wl,r,['Stt','Đoạn tuyến','Chiều dài (m)','Số VT','Cột néo','Cột đỡ'],30);r++;
  secs.forEach((s,j)=>{dataRow(wl,r,[j+1,s.ten,+s.len.toFixed(2),s.nCot,s.nNeo,s.nDo],{left:[1]});r++});
  dataRow(wl,r,['','Tổng cộng',+lk.len.toFixed(2),lk.nCot,lk.nNeo,lk.nDo],{bold:true,fill:'FFF2F2F2',left:[1]});r+=2;
  const s2=wl.getCell(r,1);s2.value='II. LIỆT KÊ VẬT LIỆU – CẤU KIỆN CHÍNH';s2.font={name:F,size:11,bold:true};r++;
  const lkHead=r; headRow(wl,r,['Stt','Tên vật liệu','Mã hiệu','Đơn vị','Số lượng','Ghi chú'],30);r++; numRow(wl,r,6);r++;
  let n=0; const ROMAN=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV'];let gi=0;
  allGroups().forEach(([g,gn])=>{const its=lk.items.filter(x=>x.nhom===g&&x.sl);if(!its.length)return;
    dataRow(wl,r,[ROMAN[gi++],gn,'','','',''],{bold:true,fill:'FFF7F7F7',left:[1]});wl.mergeCells(r,2,r,6);r++;
    its.forEach(x=>{dataRow(wl,r,[++n,x.ten,x.ma,x.dvt,+x.sl.toFixed(2),num(x.hh)?`Đã tính ${num(x.hh).toLocaleString('vi-VN')}% hao hụt`:''],{left:[1,5]});r++})});
  if(lk.th.length){dataRow(wl,r,[ROMAN[gi++],'Phần thu hồi về kho (cáp quang)','','','',''],{bold:true,fill:'FFF7F7F7',left:[1]});wl.mergeCells(r,2,r,6);r++;
    lk.th.forEach((x,j)=>{dataRow(wl,r,[j+1,x.ten,'',x.dvt,+x.sl.toFixed(2),''],{left:[1]});r++})}
  page(wl,'portrait',9,`${lkHead}:${lkHead+1}`);

  /* ---- Sheet Tổng kê ---- */
  const wt=wb.addWorksheet('Tongke',{views:[{state:'frozen',xSplit:2,ySplit:5,showGridLines:false}]});
  const nT=COLS.length+3;
  title(wt,1,'BẢNG TỔNG KÊ PHẦN ĐƯỜNG DÂY – '+projTitle,nT,13);
  head2(wt,3,['STT'],COLS.map(c=>c[0]==='goc'?[c[0],'Góc lái',...c.slice(2)]:c),['Khoảng néo','K/c đại biểu (m)']); numRow(wt,5,nT);
  wt.columns=[{width:5},...COLS.map(c=>({width:Math.max(6,Math.round(c[2]/7.5))})),{width:8},{width:10}];
  wt.getColumn(COLS.findIndex(c=>c[0]==='goc')+2).width=17;
  r=6; let stt=0;
  rows.forEach((x,i)=>{
    if(x.type==='sec'){dataRow(wt,r,['',[x.vt,x.gc].filter(Boolean).join('. '),...Array(nT-2).fill('')],{bold:true,fill:'FFEEF3FA',left:[1]});wt.mergeCells(r,2,r,nT);r++;return}
    const vals=[++stt,...COLS.map(([k,,,kind])=>kind==='n'?nv(x[k]):(x[k]??'')),a.kn[i]??'',a.kdb[i]!=null?+a.kdb[i].toFixed(1):''];
    dataRow(wt,r,vals,{size:9,left:[COLS.findIndex(c=>c[0]==='gc')+1]}); r++;
  });
  // tổng cộng các cột số
  const tot=['','Tổng',...COLS.slice(1).map(([k,,,kind])=>FOOT_SPECIAL[k]?(FOOT_SPECIAL[k]()?fmt(FOOT_SPECIAL[k](),1)+' m':''):kind==='n'&&!NO_SUM.has(k)?colSum(k)||'':''),'',''];
  dataRow(wt,r,tot,{bold:true,size:9,fill:'FFF2F2F2'});
  page(wt,'landscape',8,'3:5');

  /* ---- Sheet cáp quang ---- */
  const hasCq=rows.some(x=>x.type!=='sec'&&(x.cq||CQ_COLS.some(c=>c[3]==='n'&&num(x[c[0]]))));
  if(hasCq){
    const wc=wb.addWorksheet('TKCQ',{views:[{state:'frozen',xSplit:2,ySplit:5,showGridLines:false}]});
    const nC=CQ_COLS.length+7;
    title(wc,1,'BẢNG TỔNG KÊ CÁP QUANG – '+projTitle,nC,13); head2(wc,3,['STT','Tên vị trí','Loại cột','Công dụng','Khoảng cột (m)'],CQ_COLS,['Chiều dài cáp (m)','Ru lô (m)']); numRow(wc,5,nC);
    wc.columns=[{width:5},{width:10},{width:13},{width:11},{width:9},...CQ_COLS.map(c=>({width:Math.max(7,Math.round(c[2]/7))})),{width:11},{width:10}];
    r=6; let sq=0;
    rows.forEach((x,i)=>{
      if(x.type==='sec'){dataRow(wc,r,['',[x.vt,x.gc].filter(Boolean).join('. '),...Array(nC-2).fill('')],{bold:true,fill:'FFEEF3FA',left:[1]});wc.mergeCells(r,2,r,nC);r++;return}
      const vals=[++sq,x.vt||'',x.cot||'',x.cd||'',nv(x.kc),...CQ_COLS.map(([k,,,kind])=>kind==='n'?nv(x[k]):(x[k]??'')),cqc.per[i]?+cqc.per[i].toFixed(2):'',cqc.rulo[i]?+cqc.rulo[i].len.toFixed(1):''];
      dataRow(wc,r,vals,{size:9,left:[5+CQ_COLS.findIndex(c=>c[0]==='q_gc')]});r++});
    dataRow(wc,r,['','Tổng','','',+rows.reduce((s,x)=>s+(x.type==='sec'?0:num(x.kc)),0).toFixed(2),...CQ_COLS.map(([k,,,kind])=>kind==='n'&&!NO_SUM.has(k)?colSum(k)||'':''),+cqc.len.toFixed(2),''],{bold:true,size:9,fill:'FFF2F2F2'});
    page(wc,'landscape',9,'3:5');
  }

  /* ---- Sheet thiết bị ---- */
  const wd=wb.addWorksheet('ThietBi',{views:[{showGridLines:false}]});
  wd.columns=[{width:6},{width:26},{width:22},{width:46},{width:9},{width:11}];
  title(wd,1,'DANH SÁCH THIẾT BỊ, VẬT LIỆU DÙNG TRONG DỰ ÁN',6,13); title(wd,2,projTitle,6,11);
  headRow(wd,4,['Stt','Nhóm','Mã hiệu','Tên thiết bị / vật liệu','Đơn vị','Hao hụt (%)'],30);
  r=5; effCat().filter(c=>c.ma).forEach((c,j)=>{dataRow(wd,r,[j+1,gname(c.nhom)||c.nhom,c.ma,c.ten,c.dvt,c.hh===''?'':num(c.hh)],{left:[1,3]});r++});
  page(wd,'portrait',9,'4:4');

  const buf=await wb.xlsx.writeBuffer();
  const fname='Tong ke DZ - '+cur.name.replace(/[\\/:*?"<>|]/g,'').slice(0,80)+'.xlsx';
  const lnk=document.createElement('a');lnk.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));lnk.download=fname;document.body.appendChild(lnk);lnk.click();setTimeout(()=>{URL.revokeObjectURL(lnk.href);lnk.remove()},1000);toast('Đã xuất file Excel');
}
